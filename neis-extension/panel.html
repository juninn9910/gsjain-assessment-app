<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  :root { --line:#e2e8f0; --sub:#64748b; --teal:#0f766e; --red:#dc2626; --amber:#b45309; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font:13px/1.5 "Malgun Gothic","맑은 고딕",system-ui,sans-serif; color:#1f2937;
         padding:14px; display:flex; flex-direction:column; gap:8px; }
  h1 { font-size:14px; font-weight:700; color:var(--teal); }
  .sub { font-size:11px; color:var(--sub); }
  textarea { width:100%; flex:0 0 auto; height:150px; border:1px solid var(--line); border-radius:6px;
             padding:8px; font:12px/1.45 Consolas,monospace; resize:vertical; }
  .row { display:flex; gap:6px; align-items:center; }
  button { flex:1; padding:8px; border:0; border-radius:6px; font-size:13px; font-weight:600;
           cursor:pointer; background:#f1f5f9; color:#334155; }
  button.primary { background:var(--teal); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  label.speed { font-size:11px; color:var(--sub); display:flex; align-items:center; gap:4px; }
  select { font-size:11px; padding:3px; border:1px solid var(--line); border-radius:4px; }
  #out { flex:1 1 auto; overflow:auto; font-size:12px; min-height:60px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:3px 4px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
  td.n { width:64px; font-weight:600; }
  td.s { width:20px; text-align:center; }
  .ok { color:var(--teal); } .bad { color:var(--red); }
  .note { padding:8px; background:#fffbeb; border:1px solid #fde68a;
          border-radius:6px; font-size:11px; color:var(--amber); line-height:1.5; }
  .msg { margin-bottom:6px; font-size:12px; }
</style>
</head>
<body>
  <div>
    <h1>교과학습발달상황 입력 도우미</h1>
    <div class="sub">앱에서 <b>[나이스] 복사</b>를 누른 뒤 아래 <b>붙여넣기</b>를 누르세요.</div>
  </div>

  <div class="row">
    <button id="paste">📋 붙여넣기</button>
    <button id="clear">지우기</button>
  </div>

  <textarea id="json" placeholder='[
  {"name": "홍길동", "num": "1", "text": "…"}
]'></textarea>

  <div class="row">
    <button id="check">데이터 확인</button>
    <button id="fill" class="primary" disabled>자동 입력 시작</button>
  </div>

  <div class="row">
    <label class="speed">속도
      <select id="speed">
        <option value="350">빠르게</option>
        <option value="450" selected>보통</option>
        <option value="800">천천히</option>
      </select>
    </label>
  </div>

  <div id="out"></div>

  <div class="note">
    이 도구는 <b>저장을 누르지 않습니다.</b><br>
    입력이 끝나면 화면에서 내용을 확인하신 뒤 <b>저장</b> 버튼을 눌러 주세요.
  </div>

  <script src="panel.js"></script>
</body>
</html>
