<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  :root { --line:#e2e8f0; --sub:#64748b; --teal:#0f766e; --red:#dc2626; --amber:#b45309; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:420px; font:13px/1.5 "Malgun Gothic","맑은 고딕",system-ui,sans-serif; color:#1f2937; padding:14px; }
  h1 { font-size:14px; font-weight:700; color:var(--teal); margin-bottom:2px; }
  .sub { font-size:11px; color:var(--sub); margin-bottom:10px; }
  textarea { width:100%; height:150px; border:1px solid var(--line); border-radius:6px;
             padding:8px; font:12px/1.45 Consolas,monospace; resize:vertical; }
  .row { display:flex; gap:6px; margin-top:8px; align-items:center; }
  button { flex:1; padding:8px; border:0; border-radius:6px; font-size:13px; font-weight:600;
           cursor:pointer; background:#f1f5f9; color:#334155; }
  button.primary { background:var(--teal); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  label.speed { font-size:11px; color:var(--sub); display:flex; align-items:center; gap:4px; }
  select { font-size:11px; padding:3px; border:1px solid var(--line); border-radius:4px; }
  #out { margin-top:10px; max-height:230px; overflow:auto; font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:3px 4px; border-bottom:1px solid #f1f5f9; }
  td.n { width:70px; font-weight:600; }
  td.s { width:22px; text-align:center; }
  .ok { color:var(--teal); } .bad { color:var(--red); }
  .note { margin-top:10px; padding:8px; background:#fffbeb; border:1px solid #fde68a;
          border-radius:6px; font-size:11px; color:var(--amber); line-height:1.5; }
  .msg { margin-top:8px; font-size:12px; }
</style>
</head>
<body>
  <h1>교과학습발달상황 입력 도우미</h1>
  <div class="sub">과정중심평가 앱에서 복사한 JSON을 붙여넣으세요.</div>

  <textarea id="json" placeholder='[
  {"name": "홍길동", "text": "…"},
  {"name": "김철수", "text": "…"}
]'></textarea>

  <div class="row">
    <button id="check">데이터 확인</button>
    <button id="fill" class="primary" disabled>자동 입력 시작</button>
  </div>
  <div class="row">
    <label class="speed">속도
      <select id="speed">
        <option value="350">빠르게</option>
        <option value="450" selected>보통</option>
        <option value="800">천천히</option>
      </select>
    </label>
  </div>

  <div id="out"></div>

  <div class="note">
    이 확장은 <b>저장을 누르지 않습니다.</b><br>
    입력이 끝나면 화면에서 내용을 직접 확인하신 뒤 <b>저장</b> 버튼을 눌러 주세요.
  </div>

  <script src="popup.js"></script>
</body>
</html>
