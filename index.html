<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경산자인학교 과정중심평가 관리</title>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="preset.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg1: #ffffff; --bg2: #f8fafc; --bg3: #eef2f6;
  --card-bg: rgba(255,255,255,0.65);
  --card-border: rgba(16,122,87,0.15);
  --header-bg: rgba(255,255,255,0.7);
  --sidebar-bg: rgba(253,242,248,0.85);
  --pink: #0f766e; --pink-light: #14b8a6;
  --lavender: #c084fc; --mint: #34d399;
  --red: #fb7185; --amber: #fbbf24;
  --text-dark: #1f2937; --text-sub: rgba(31,41,55,0.62);
  --shadow: 0 8px 32px rgba(16,122,87,0.08);
  --radius: 16px; --radius-sm: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
  min-height: 100vh; color: var(--text-dark);
  overflow-x: hidden;
}

.glass {
  background: var(--card-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.glass-strong {
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* Header */
.app-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: var(--header-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--card-border);
  box-shadow: 0 4px 20px rgba(16,122,87,0.06);
}
.app-header .logo { font-size: 18px; font-weight: 700; color: var(--text-dark); }
.app-header .logo span { color: var(--pink); }
.app-header .teacher-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }

/* Sidebar */
.sidebar {
  position: fixed; top: 60px; left: 0; bottom: 0; width: 220px; z-index: 90;
  background: var(--sidebar-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--card-border);
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 500; cursor: pointer;
  transition: all 0.2s ease; border: none; background: transparent;
  color: var(--text-dark); text-align: left; width: 100%;
}
.sidebar-item:hover { background: rgba(16,122,87,0.08); }
.sidebar-item.active {
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: white; box-shadow: 0 4px 16px rgba(16,122,87,0.25);
}

/* Main */
.main { margin-left: 220px; margin-top: 60px; padding: 24px; min-height: calc(100vh - 60px); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: var(--radius-sm); border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.2s ease;
}
.btn-pink {
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: white; box-shadow: 0 4px 16px rgba(16,122,87,0.2);
}
.btn-pink:hover { box-shadow: 0 4px 20px rgba(16,122,87,0.35); transform: translateY(-1px); }
.btn-mint { background: var(--mint); color: white; }
.btn-mint:hover { box-shadow: 0 4px 16px rgba(52,211,153,0.3); }
.btn-lavender { background: var(--lavender); color: white; }
.btn-lavender:hover { box-shadow: 0 4px 16px rgba(192,132,252,0.3); }
.btn-red { background: var(--red); color: white; }
.btn-red:hover { box-shadow: 0 4px 16px rgba(251,113,133,0.3); }
.btn-ghost {
  background: rgba(255,255,255,0.5); color: var(--text-dark);
  border: 1px solid var(--card-border);
}
.btn-ghost:hover { background: rgba(255,255,255,0.8); }
.btn-sm { padding: 6px 14px; font-size: 13px; }

/* Inputs */
input[type="text"], input[type="number"], textarea, select {
  padding: 10px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--card-border);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 14px; color: var(--text-dark);
  transition: all 0.2s ease; width: 100%;
  font-family: inherit;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(16,122,87,0.1);
}
textarea { resize: vertical; min-height: 80px; }
select { cursor: pointer; }

/* Tags */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: rgba(16,122,87,0.1);
  backdrop-filter: blur(8px); color: var(--pink);
}
.tag-mint { background: rgba(52,211,153,0.12); color: #059669; }
.tag-red { background: rgba(251,113,133,0.12); color: #e11d48; }
.tag-amber { background: rgba(251,191,36,0.12); color: #d97706; }

/* Modal Overlay */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
  background: rgba(136,19,55,0.15);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.modal-box {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 32px;
  box-shadow: 0 16px 48px rgba(16,122,87,0.12);
  max-width: 400px; width: 90%; text-align: center;
}
.modal-box h3 { margin-bottom: 12px; font-size: 18px; }
.modal-box p { margin-bottom: 24px; color: var(--text-sub); font-size: 14px; }
.modal-actions { display: flex; gap: 12px; justify-content: center; }

/* Toast */
.toast-container {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
}
.toast {
  padding: 12px 24px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  box-shadow: 0 8px 32px rgba(16,122,87,0.12);
  font-size: 14px; font-weight: 500; color: var(--text-dark);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
@keyframes shakeX { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.shake-anim { animation: shakeX 0.4s ease; }

/* Teacher Select Screen */
.teacher-select-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: calc(100vh - 120px); padding: 40px 20px 20px;
}

/* Lock Screen */
.lock-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px 20px;
  background: linear-gradient(160deg, #ffffff 0%, #eef2f6 30%, #f8fafc 60%, #ffffff 100%);
}
.lock-box {
  max-width: 360px; width: 100%; padding: 48px 36px 40px; text-align: center;
  border-radius: 24px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(16,122,87,0.12);
  box-shadow: 0 20px 60px rgba(16,122,87,0.08), 0 4px 20px rgba(0,0,0,0.03);
}
.lock-icon {
  font-size: 56px; margin-bottom: 16px;
  filter: drop-shadow(0 4px 12px rgba(16,122,87,0.15));
}
.lock-title {
  font-size: 22px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px;
}
.lock-title span { color: var(--pink); }
.lock-sub {
  font-size: 13px; color: var(--text-sub); margin-bottom: 32px; letter-spacing: 0.03em;
}
.lock-dots {
  display: flex; justify-content: center; gap: 14px; margin-bottom: 24px;
}
.lock-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid rgba(16,122,87,0.3);
  background: transparent;
  transition: all 0.2s ease;
}
.lock-dot.filled {
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  border-color: var(--pink);
  box-shadow: 0 2px 8px rgba(16,122,87,0.3);
}
.lock-input {
  width: 160px !important; margin: 0 auto; display: block;
  text-align: center; font-size: 24px; letter-spacing: 12px;
  padding: 12px 16px !important;
  border: 2px solid rgba(16,122,87,0.2) !important;
  border-radius: 16px !important;
  background: rgba(255,255,255,0.6) !important;
  caret-color: var(--pink);
}
.lock-input:focus {
  border-color: var(--pink) !important;
  box-shadow: 0 0 0 4px rgba(16,122,87,0.1) !important;
}
.lock-input::placeholder { letter-spacing: 12px; color: rgba(16,122,87,0.25); }
.lock-hint {
  margin-top: 16px; font-size: 12px; color: var(--text-sub); letter-spacing: 0.02em;
}
.teacher-select-box {
  max-width: 480px; width: 100%; padding: 40px; text-align: center;
}
.teacher-select-box h1 { font-size: 28px; margin-bottom: 8px; }
.teacher-select-box h1 span { color: var(--pink); }
.teacher-select-box .sub { color: var(--text-sub); margin-bottom: 32px; font-size: 15px; }
.teacher-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 32px; }
.teacher-btn {
  padding: 16px 28px; border-radius: var(--radius-sm); border: 2px solid var(--card-border);
  background: rgba(255,255,255,0.6); font-size: 16px; font-weight: 600;
  cursor: pointer; transition: all 0.2s ease; color: var(--text-dark);
}
.teacher-btn:hover {
  border-color: var(--pink); background: rgba(16,122,87,0.05);
  box-shadow: 0 4px 16px rgba(16,122,87,0.15);
}
.teacher-add { display: flex; gap: 8px; margin-top: 8px; }

/* Grid cards for home */
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.home-card {
  padding: 28px 20px; text-align: center; cursor: pointer;
  transition: all 0.2s ease; border: none;
  font-family: inherit; color: var(--text-dark);
}
.home-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(16,122,87,0.12); }
.home-card .emoji { font-size: 36px; margin-bottom: 12px; }
.home-card .label { font-size: 15px; font-weight: 600; }

/* Home hero (상단 인사 + 현황) */
.home-hero {
  padding: 28px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
  flex-wrap: wrap;
}
.home-hero-title {
  font-size: 24px; font-weight: 700; color: var(--text-dark);
  letter-spacing: -0.01em; line-height: 1.35;
}
.home-stats { display: flex; gap: 20px; flex-wrap: wrap; }
.home-stat {
  padding: 14px 22px; border-radius: 14px;
  background: rgba(255,255,255,0.55);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  min-width: 96px;
}
.home-stat-label { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-bottom: 4px; letter-spacing: 0.02em; }
.home-stat-value {
  font-size: 24px; font-weight: 700; color: var(--pink);
  display: flex; align-items: baseline; gap: 4px;
}
.home-stat-unit { font-size: 13px; font-weight: 500; color: var(--text-sub); }

/* Home rich cards */
.home-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}
.home-card-rich {
  padding: 22px 22px 20px;
  text-align: left; cursor: pointer;
  border: none; font-family: inherit; color: var(--text-dark);
  display: flex; flex-direction: column; gap: 10px;
  transition: all 0.25s ease;
  position: relative; overflow: hidden;
}
.home-card-rich::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--pink), var(--pink-light));
  opacity: 0; transition: opacity 0.25s ease;
}
.home-card-rich:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 40px rgba(16,122,87,0.14);
  border-color: rgba(16,122,87,0.3);
}
.home-card-rich:hover::before { opacity: 1; }
.home-card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2px;
}
.home-card-emoji { font-size: 32px; line-height: 1; }
.home-card-chip {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px;
  background: rgba(16,122,87,0.1); color: var(--pink);
  backdrop-filter: blur(8px);
}
.home-card-chip-accent {
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: white; letter-spacing: 0.05em;
}
.home-card-title { font-size: 17px; font-weight: 700; color: var(--text-dark); }
.home-card-desc { font-size: 13px; color: var(--text-sub); line-height: 1.55; flex: 1; }
.home-card-cta {
  font-size: 13px; font-weight: 600; color: var(--pink);
  margin-top: 6px; opacity: 0.8; transition: all 0.2s ease;
}
.home-card-rich:hover .home-card-cta { opacity: 1; transform: translateX(2px); }
.home-card-highlight {
  background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(252,231,243,0.65));
}

/* Footer */
.app-footer {
  margin-left: 220px; padding: 24px 32px 40px;
  text-align: center;
}
.app-footer-inner {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 10px 22px; border-radius: 20px;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  font-size: 12px; color: var(--text-sub); font-weight: 500;
  letter-spacing: 0.02em;
}
.app-footer-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--pink); opacity: 0.6;
}
.app-footer-brand { color: var(--pink); font-weight: 700; }

/* Section title */
.section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.section-title .emoji { margin-right: 8px; }

/* Grade/Class buttons */
.num-btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.num-btn {
  width: 48px; height: 48px; border-radius: var(--radius-sm);
  border: 2px solid var(--card-border); background: rgba(255,255,255,0.5);
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  color: var(--text-dark); display: flex; align-items: center; justify-content: center;
}
.num-btn:hover { border-color: var(--pink); }
.num-btn.active {
  border-color: var(--pink); background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: white; box-shadow: 0 4px 16px rgba(16,122,87,0.25);
}

/* Level buttons */
.level-btn-group { display: flex; flex-direction: column; gap: 8px; }
.level-btn {
  padding: 10px 16px; border-radius: var(--radius-sm); border: 2px solid transparent;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  background: rgba(255,255,255,0.5);
}
.level-btn.h { border-color: rgba(52,211,153,0.3); color: #059669; }
.level-btn.h.active { background: var(--mint); color: white; box-shadow: 0 4px 16px rgba(52,211,153,0.3); }
.level-btn.m { border-color: rgba(251,191,36,0.3); color: #d97706; }
.level-btn.m.active { background: var(--amber); color: white; box-shadow: 0 4px 16px rgba(251,191,36,0.3); }
.level-btn.l { border-color: rgba(251,113,133,0.3); color: #e11d48; }
.level-btn.l.active { background: var(--red); color: white; box-shadow: 0 4px 16px rgba(251,113,133,0.3); }

/* Card list */
.card-list { display: flex; flex-direction: column; gap: 12px; }
.card-item { padding: 16px 20px; }
.card-item .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.card-item .card-title { font-size: 16px; font-weight: 600; }

/* Unit memo layout */
.memo-unit-card { padding: 20px; margin-bottom: 16px; }
.memo-unit-inner { display: flex; gap: 16px; align-items: flex-start; }
.memo-unit-left { flex-shrink: 0; width: 80px; }
.memo-unit-right { flex: 1; }

/* Rubric display */
.rubric-preview {
  padding: 12px; border-radius: var(--radius-sm); margin-top: 12px;
  background: rgba(255,255,255,0.4); font-size: 12px; color: var(--text-sub);
}
.rubric-preview .rp-row { margin-bottom: 4px; }
.rubric-preview .rp-label { font-weight: 700; }

/* AI result cards */
.ai-result-card { padding: 20px; margin-bottom: 16px; }
.ai-result-card textarea {
  width: 100%; min-height: 120px; margin: 12px 0;
  background: rgba(255,255,255,0.5); border: 1px solid var(--card-border);
}

/* Spinner */
.spinner {
  display: inline-block; width: 20px; height: 20px;
  border: 3px solid rgba(16,122,87,0.2); border-top-color: var(--pink);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 180px; }
  .main { margin-left: 180px; }
  .app-footer { margin-left: 180px; }
  .home-hero { padding: 22px; gap: 20px; }
  .home-hero-title { font-size: 20px; }
}
@media (max-width: 600px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .app-footer { margin-left: 0; padding: 20px 16px 32px; }
  .home-stats { width: 100%; }
  .home-stat { flex: 1 1 calc(50% - 10px); min-width: 0; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(16,122,87,0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(16,122,87,0.3); }

/* Inline flex helpers */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.flex-1 { flex: 1; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.w-full { width: 100%; }
.text-center { text-align: center; }
.text-sm { font-size: 13px; }
.text-sub { color: var(--text-sub); }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
